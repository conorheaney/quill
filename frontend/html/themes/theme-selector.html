<div class="theme-menu">
  <button
    type="button"
    id="themeButton"
    class="header-button"
    data-variant="secondary"
    aria-haspopup="true"
    aria-expanded="false"
    aria-controls="themePanel"
  >
    THEME
  </button>
  <div id="themePanel" class="theme-panel" hidden>
    <div class="theme-panel-header">
      <h2 class="theme-panel-title">Choose theme</h2>
    </div>
    <div class="theme-options" role="listbox" aria-label="Available themes">
      <button type="button" class="theme-option" data-theme="light" role="option">Light</button>
      <button type="button" class="theme-option" data-theme="dark" role="option">Dark</button>
      <button type="button" class="theme-option" data-theme="sepia" role="option">Sepia</button>
      <button type="button" class="theme-option" data-theme="nord" role="option">Nord</button>
    </div>
  </div>
</div>
